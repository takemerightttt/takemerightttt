<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Golos Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<style>
    .h1 { font-size: 46px; font-weight: 700; fill: #fff; letter-spacing: -0.02em; }
    .h2 { font-size: 46px; font-weight: 700; fill: #0284C7; letter-spacing: -0.02em; }
    .sub { font-size: 16px; fill: #B7C0D3; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; font-size: 13px; fill: #B7C0D3; }
    .pill { font-size: 12px; font-weight: 500; fill: #fff; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .grid line { stroke: rgba(255,255,255,.06); stroke-width: 1; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    </style>

    <rect width="1200" height="300" fill="#0F1E24"/>
    <g class="grid"><line x1="0" y1="0" x2="0" y2="300"/><line x1="40" y1="0" x2="40" y2="300"/><line x1="80" y1="0" x2="80" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="280" y1="0" x2="280" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="440" y1="0" x2="440" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/><line x1="520" y1="0" x2="520" y2="300"/><line x1="560" y1="0" x2="560" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/><line x1="640" y1="0" x2="640" y2="300"/><line x1="680" y1="0" x2="680" y2="300"/><line x1="720" y1="0" x2="720" y2="300"/><line x1="760" y1="0" x2="760" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="840" y1="0" x2="840" y2="300"/><line x1="880" y1="0" x2="880" y2="300"/><line x1="920" y1="0" x2="920" y2="300"/><line x1="960" y1="0" x2="960" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/><line x1="1040" y1="0" x2="1040" y2="300"/><line x1="1080" y1="0" x2="1080" y2="300"/><line x1="1120" y1="0" x2="1120" y2="300"/><line x1="1160" y1="0" x2="1160" y2="300"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/></g>
    <rect x="0" y="0" width="1200" height="3" fill="#0369A1"/>
    <rect x="56" y="58" width="44" height="44" rx="4" fill="#0369A1"/>
    <text x="78" y="89" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">K</text>
    <text x="118" y="92" class="h1">Hello There 👋</text>
    <text x="118" y="146" class="h2">General Kenobi !<tspan class="cursor" fill="#0284C7">_</tspan></text>
    <text x="118" y="192" class="sub">Ivan Kulyaev · Senior Software Engineer</text>
    <text x="118" y="222" class="mono">React / Next.js / TypeScript / Node.js / NestJS / Express</text>
    <g transform="translate(944,60)">
      <rect x="0" y="0" width="200" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
      <circle class="dot" cx="18" cy="15" r="4" fill="#0D9488"/>
      <text x="32" y="19" class="pill">based in Vietnam</text>
    </g>
    <g transform="translate(944,102)">
      <rect x="0" y="0" width="200" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)"/>
      <circle cx="18" cy="15" r="4" fill="#818CF8"/>
      <text x="32" y="19" class="pill">open to remote roles</text>
    </g>
    
</svg>
